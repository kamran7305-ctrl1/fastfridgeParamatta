name: Deploy to Hostinger (FTP)

on:
  push:
    branches:
      - main
      - 'claude/**'

# Only one FTP deploy may run at a time. Two deploys running together (for example
# two PR merges in a row) can finish out of order, and the one that finishes last
# overwrites the server with an older copy of the site and deletes newer pages.
concurrency:
  group: hostinger-ftp-deploy
  cancel-in-progress: false

jobs:
  checks:
    name: Lint and site audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './.buildtools/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Static site audit (routes, links, canonicals, robots, sitemap inputs)
        run: python3 tests/site_audit.py

  deploy:
    name: FTP deploy
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for page dates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build site manifest (page list and last-changed dates for sitemap.xml)
        run: python3 .github/scripts/make_site_manifest.py

      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Explicit FTPS (TLS) - Hostinger resets plain-FTP data connections.
          protocol: ftps
          # The FTP account's root is already
          # /home/u232649564/domains/fridgerepairparramatta.com.au/public_html
          # so the server dir is "./" (do NOT repeat the full path here).
          server-dir: ./
          # Never wipe the server: files that exist only there (e.g.
          # admin/includes/config.php with the DB credentials) must survive.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .buildtools/**
            **/node_modules/**
            database/**
            image.zip
            HOSTINGER_DEPLOYMENT.md
            claude/**
            CLAUDE.md
            tests/**
            .github/scripts/**

      - name: Smoke test live site
        run: |
          sleep 20
          fail=0
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "$1"); [ "$code" = "$2" ] || { echo "FAIL $1 expected $2 got $code"; fail=1; }; }
          check https://fridgerepairparramatta.com.au/ 200
          check https://fridgerepairparramatta.com.au/robots.txt 200
          check https://fridgerepairparramatta.com.au/sitemap.xml 200
          check https://fridgerepairparramatta.com.au/fridge-regas 200
          check https://fridgerepairparramatta.com.au/this-page-does-not-exist 404
          check https://fridgerepairparramatta.com.au/.ftp-deploy-sync-state.json 403
          exit $fail
